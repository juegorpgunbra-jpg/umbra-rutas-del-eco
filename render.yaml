services:
  - type: web
    name: umbra-rutas-del-eco
    runtime: node
    plan: free
    numInstances: 1
    buildCommand: >-
      corepack pnpm install --frozen-lockfile &&
      PORT=4173 BASE_PATH=/ corepack pnpm --filter @workspace/umbra-echo run build &&
      corepack pnpm --filter @workspace/api-server run build
    startCommand: corepack pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_GAME
        value: "true"
